<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Honda Unicorn Motorcycle</title>

  <!-- Background -->
  <rect width="800" height="500" fill="#f0f4f8"/>

  <!-- Ground / Shadow -->
  <ellipse cx="400" cy="430" rx="320" ry="18" fill="rgba(0,0,0,0.08)"/>

  <!-- ===== REAR WHEEL ===== -->
  <g id="rear-wheel">
    <!-- Tire -->
    <circle cx="220" cy="380" r="72" fill="#1a1a1a" stroke="#111" stroke-width="2"/>
    <circle cx="220" cy="380" r="60" fill="#2a2a2a"/>
    <circle cx="220" cy="380" r="55" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- Rim -->
    <circle cx="220" cy="380" r="38" fill="#888" stroke="#666" stroke-width="2"/>
    <circle cx="220" cy="380" r="35" fill="#aaa"/>
    <circle cx="220" cy="380" r="32" fill="none" stroke="#999" stroke-width="1"/>
    <!-- Hub -->
    <circle cx="220" cy="380" r="12" fill="#777" stroke="#555" stroke-width="2"/>
    <circle cx="220" cy="380" r="6" fill="#444"/>
    <!-- Spokes -->
    <g stroke="#999" stroke-width="1.5">
      <line x1="220" y1="345" x2="220" y2="368"/>
      <line x1="220" y1="392" x2="220" y2="415"/>
      <line x1="185" y1="380" x2="208" y2="380"/>
      <line x1="232" y1="380" x2="255" y2="380"/>
      <line x1="195" y1="355" x2="211" y2="371"/>
      <line x1="229" y1="389" x2="245" y2="405"/>
      <line x1="245" y1="355" x2="229" y2="371"/>
      <line x1="195" y1="405" x2="211" y2="389"/>
    </g>
    <!-- Disc brake -->
    <circle cx="220" cy="380" r="26" fill="none" stroke="#bbb" stroke-width="3" stroke-dasharray="4 3"/>
  </g>

  <!-- ===== FRONT WHEEL ===== -->
  <g id="front-wheel">
    <!-- Tire -->
    <circle cx="590" cy="380" r="72" fill="#1a1a1a" stroke="#111" stroke-width="2"/>
    <circle cx="590" cy="380" r="60" fill="#2a2a2a"/>
    <circle cx="590" cy="380" r="55" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- Rim -->
    <circle cx="590" cy="380" r="38" fill="#888" stroke="#666" stroke-width="2"/>
    <circle cx="590" cy="380" r="35" fill="#aaa"/>
    <circle cx="590" cy="380" r="32" fill="none" stroke="#999" stroke-width="1"/>
    <!-- Hub -->
    <circle cx="590" cy="380" r="12" fill="#777" stroke="#555" stroke-width="2"/>
    <circle cx="590" cy="380" r="6" fill="#444"/>
    <!-- Spokes -->
    <g stroke="#999" stroke-width="1.5">
      <line x1="590" y1="345" x2="590" y2="368"/>
      <line x1="590" y1="392" x2="590" y2="415"/>
      <line x1="555" y1="380" x2="578" y2="380"/>
      <line x1="602" y1="380" x2="625" y2="380"/>
      <line x1="565" y1="355" x2="581" y2="371"/>
      <line x1="599" y1="389" x2="615" y2="405"/>
      <line x1="615" y1="355" x2="599" y2="371"/>
      <line x1="565" y1="405" x2="581" y2="389"/>
    </g>
    <!-- Front disc brake -->
    <circle cx="590" cy="380" r="30" fill="none" stroke="#bbb" stroke-width="4" stroke-dasharray="5 3"/>
    <rect x="614" y="365" width="12" height="30" rx="3" fill="#666" stroke="#555" stroke-width="1"/>
  </g>

  <!-- ===== CHAIN & SPROCKET ===== -->
  <g id="chain">
    <circle cx="220" cy="380" r="18" fill="none" stroke="#555" stroke-width="3"/>
    <circle cx="340" cy="340" r="10" fill="none" stroke="#555" stroke-width="3"/>
    <line x1="220" y1="362" x2="340" y2="330" stroke="#555" stroke-width="2.5"/>
    <line x1="220" y1="398" x2="340" y2="350" stroke="#555" stroke-width="2.5"/>
  </g>

  <!-- ===== REAR SWINGARM ===== -->
  <g id="swingarm">
    <polygon points="220,375 220,385 370,345 370,335" fill="#555" stroke="#444" stroke-width="1"/>
    <!-- Rear shock -->
    <line x1="290" y1="280" x2="270" y2="370" stroke="#888" stroke-width="4"/>
    <rect x="282" y="290" width="12" height="30" rx="3" fill="#ffd700" stroke="#cc9900" stroke-width="1"/>
  </g>

  <!-- ===== ENGINE ===== -->
  <g id="engine">
    <!-- Engine block -->
    <rect x="280" y="310" width="110" height="75" rx="8" fill="#444" stroke="#333" stroke-width="2"/>
    <!-- Cylinder head -->
    <rect x="295" y="280" width="80" height="35" rx="5" fill="#555" stroke="#444" stroke-width="2"/>
    <!-- Cylinder fins -->
    <g stroke="#666" stroke-width="1.5">
      <line x1="298" y1="288" x2="372" y2="288"/>
      <line x1="298" y1="295" x2="372" y2="295"/>
      <line x1="298" y1="302" x2="372" y2="302"/>
      <line x1="298" y1="309" x2="372" y2="309"/>
    </g>
    <!-- Engine details -->
    <circle cx="335" cy="350" r="15" fill="#555" stroke="#666" stroke-width="1.5"/>
    <circle cx="335" cy="350" r="8" fill="#666"/>
    <rect x="380" y="330" width="15" height="25" rx="3" fill="#555" stroke="#444" stroke-width="1"/>
    <!-- Oil filter -->
    <circle cx="305" cy="375" r="10" fill="#333" stroke="#444" stroke-width="1.5"/>
  </g>

  <!-- ===== EXHAUST ===== -->
  <g id="exhaust">
    <path d="M 390 350 Q 420 370, 400 400 Q 380 420, 300 420 Q 230 420, 180 430"
          fill="none" stroke="#888" stroke-width="8" stroke-linecap="round"/>
    <path d="M 390 350 Q 420 370, 400 400 Q 380 420, 300 420 Q 230 420, 180 430"
          fill="none" stroke="#aaa" stroke-width="5" stroke-linecap="round"/>
    <!-- Exhaust tip -->
    <ellipse cx="178" cy="432" rx="10" ry="6" fill="#999" stroke="#777" stroke-width="1.5"/>
  </g>

  <!-- ===== FRAME ===== -->
  <g id="frame">
    <!-- Main frame tubes -->
    <path d="M 370 335 L 470 200 L 530 200 L 570 280" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 370 335 L 400 260 L 470 200" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <!-- Down tube -->
    <line x1="470" y1="220" x2="350" y2="320" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <!-- Rear subframe -->
    <line x1="370" y1="335" x2="280" y2="260" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <line x1="390" y1="300" x2="280" y2="260" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ===== FRONT FORK ===== -->
  <g id="front-fork">
    <!-- Fork tubes -->
    <line x1="555" y1="220" x2="590" y2="380" stroke="#888" stroke-width="7"/>
    <line x1="555" y1="220" x2="590" y2="380" stroke="#ccc" stroke-width="4"/>
    <!-- Fork upper (chrome) -->
    <line x1="555" y1="220" x2="568" y2="280" stroke="#ddd" stroke-width="5"/>
    <!-- Fender -->
    <path d="M 555 340 Q 590 310, 625 340" fill="none" stroke="#cc0000" stroke-width="5"/>
    <path d="M 555 340 Q 590 308, 625 340" fill="#cc0000" opacity="0.6"/>
  </g>

  <!-- ===== FUEL TANK ===== -->
  <g id="fuel-tank">
    <!-- Tank body - Honda Unicorn Red -->
    <path d="M 370 210 Q 380 180, 430 170 Q 480 162, 520 170 Q 540 175, 540 200 Q 540 225, 520 230 Q 480 238, 430 238 Q 380 238, 370 225 Z"
          fill="#cc0000" stroke="#990000" stroke-width="2"/>
    <!-- Tank highlight -->
    <path d="M 390 195 Q 420 180, 470 177 Q 510 175, 525 182"
          fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
    <!-- Tank stripe / Honda graphic -->
    <path d="M 385 210 Q 430 200, 480 200 Q 520 200, 535 208"
          fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tank cap -->
    <ellipse cx="460" cy="172" rx="12" ry="5" fill="#444" stroke="#333" stroke-width="1.5"/>
  </g>

  <!-- ===== SEAT ===== -->
  <g id="seat">
    <path d="M 370 220 Q 365 200, 340 198 Q 300 196, 270 210 Q 255 218, 255 235 L 280 240 Q 340 240, 370 230 Z"
          fill="#222" stroke="#111" stroke-width="2"/>
    <!-- Seat stitching -->
    <path d="M 280 220 Q 320 215, 360 218" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- Grab rail -->
    <path d="M 262 228 Q 255 215, 262 205" fill="none" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ===== REAR SECTION / TAIL ===== -->
  <g id="tail">
    <!-- Rear fender -->
    <path d="M 250 350 Q 220 340, 195 355 Q 175 368, 175 385" fill="#222" stroke="#111" stroke-width="2"/>
    <!-- Tail light -->
    <rect x="248" y="235" width="15" height="10" rx="3" fill="#ff0000" stroke="#cc0000" stroke-width="1"/>
    <rect x="250" y="237" width="5" height="6" rx="1" fill="#ff4444"/>
    <!-- Turn signal rear -->
    <circle cx="255" cy="255" r="4" fill="#ff8800" stroke="#cc6600" stroke-width="1"/>
    <!-- Mud guard -->
    <path d="M 200 360 Q 210 340, 240 330 L 255 340 Q 230 350, 210 365 Z" fill="#222"/>
    <!-- License plate -->
    <rect x="222" y="405" width="30" height="18" rx="2" fill="#fff" stroke="#999" stroke-width="1"/>
    <text x="237" y="418" font-family="Arial" font-size="6" fill="#333" text-anchor="middle">UNI</text>
  </g>

  <!-- ===== HEADLIGHT ===== -->
  <g id="headlight">
    <!-- Headlight housing -->
    <ellipse cx="570" cy="215" rx="22" ry="20" fill="#333" stroke="#222" stroke-width="2"/>
    <ellipse cx="570" cy="215" rx="18" ry="16" fill="#ffffcc" stroke="#ddd" stroke-width="1.5"/>
    <ellipse cx="570" cy="215" rx="12" ry="10" fill="#fff9e0"/>
    <ellipse cx="568" cy="212" rx="5" ry="4" fill="rgba(255,255,255,0.6)"/>
    <!-- Front turn signals -->
    <ellipse cx="555" cy="240" rx="6" ry="5" fill="#ff8800" stroke="#cc6600" stroke-width="1"/>
    <ellipse cx="585" cy="240" rx="6" ry="5" fill="#ff8800" stroke="#cc6600" stroke-width="1"/>
  </g>

  <!-- ===== HANDLEBAR ===== -->
  <g id="handlebar">
    <!-- Handlebar -->
    <path d="M 520 185 Q 540 170, 560 175 Q 580 178, 590 190" fill="none" stroke="#444" stroke-width="5" stroke-linecap="round"/>
    <!-- Grips -->
    <rect x="513" y="180" width="16" height="10" rx="4" fill="#222" stroke="#111" stroke-width="1"/>
    <rect x="586" y="185" width="16" height="10" rx="4" fill="#222" stroke="#111" stroke-width="1"/>
    <!-- Mirrors -->
    <line x1="518" y1="182" x2="505" y2="165" stroke="#666" stroke-width="2"/>
    <ellipse cx="503" cy="160" rx="10" ry="7" fill="#888" stroke="#666" stroke-width="1.5"/>
    <ellipse cx="503" cy="160" rx="7" ry="5" fill="#aaddff"/>
    <line x1="596" y1="187" x2="608" y2="170" stroke="#666" stroke-width="2"/>
    <ellipse cx="610" cy="165" rx="10" ry="7" fill="#888" stroke="#666" stroke-width="1.5"/>
    <ellipse cx="610" cy="165" rx="7" ry="5" fill="#aaddff"/>
  </g>

  <!-- ===== INSTRUMENT CLUSTER ===== -->
  <g id="instruments">
    <circle cx="548" cy="192" r="12" fill="#222" stroke="#444" stroke-width="1.5"/>
    <circle cx="548" cy="192" r="9" fill="#111"/>
    <circle cx="548" cy="192" r="7" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
    <!-- Speed indicator -->
    <line x1="548" y1="192" x2="553" y2="186" stroke="#ff3333" stroke-width="1"/>
  </g>

  <!-- ===== KICKSTAND ===== -->
  <line x1="340" y1="385" x2="310" y2="430" stroke="#555" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== FOOT PEGS ===== -->
  <g id="footpegs">
    <rect x="345" y="368" width="18" height="5" rx="2" fill="#555" stroke="#444" stroke-width="1"/>
    <rect x="310" y="375" width="18" height="5" rx="2" fill="#555" stroke="#444" stroke-width="1"/>
  </g>

  <!-- ===== HONDA BRANDING ===== -->
  <g id="branding">
    <!-- Honda wing logo on tank (simplified) -->
    <text x="455" y="218" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="3">HONDA</text>
    <!-- Unicorn text -->
    <text x="320" y="265" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#999" text-anchor="middle" letter-spacing="1">UNICORN</text>
  </g>

  <!-- ===== TITLE ===== -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="16" fill="#666" text-anchor="middle" font-weight="bold">Honda Unicorn 150</text>
</svg>